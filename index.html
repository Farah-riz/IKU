<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IKU event extractor</title>
    <style>
        :root { font-family: system-ui, sans-serif; color: #172033; background: #f4f5f8; }
        body { margin: 0; }
        main { max-width: 680px; margin: 7vh auto; padding: 2rem; background: white; border-radius: 14px; box-shadow: 0 8px 30px #17203318; }
        h1 { margin-top: 0; }
        label { display: block; margin-top: 1rem; font-weight: 650; }
        input, button { box-sizing: border-box; width: 100%; padding: .75rem; margin-top: .4rem; border: 1px solid #c5cad5; border-radius: 8px; font: inherit; }
        button { color: white; background: #4f46e5; border: 0; cursor: pointer; font-weight: 650; }
        button:disabled { opacity: .6; cursor: wait; }
        .secondary { background: #687083; }
        .error { color: #a51d2d; }
        .success { color: #176b38; }
        .hidden { display: none; }
        .row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .event-list { padding-left: 1.2rem; }
        @media (max-width: 560px) { .row { grid-template-columns: 1fr; gap: 0; } }
    </style>
</head>
<body>
<main>
    <h1>Find an event in an Instagram reel</h1>
    <p>Paste a public reel link. We will extract the event details for you to check before saving.</p>

    <form id="login-form">
        <h2>Demo login</h2>
        <label for="email">Email</label>
        <input id="email" type="email" required autocomplete="email">
        <label for="password">Password</label>
        <input id="password" type="password" required autocomplete="current-password">
        <button type="submit">Log in</button>
    </form>

    <section id="app" class="hidden">
        <p>Signed in as <strong id="user-email"></strong> <button id="logout" class="secondary" type="button">Log out</button></p>
        <form id="extract-form">
            <label for="reel-url">Instagram reel URL</label>
            <input id="reel-url" type="url" placeholder="https://www.instagram.com/reel/..." required>
            <button id="extract-button" type="submit">Extract event details</button>
        </form>

        <section id="result" class="hidden">
            <h2>Check the details</h2>
            <p id="assumption" class="error"></p>
            <form id="save-form">
                <label for="event-name">Event name</label>
                <input id="event-name" required>
                <div class="row">
                    <div><label for="event-date">Date</label><input id="event-date" type="date" required></div>
                    <div><label for="event-time">Start time</label><input id="event-time" type="time" required></div>
                </div>
                <label for="event-timezone">Timezone</label>
                <input id="event-timezone" required>
                <button type="submit">Save event</button>
            </form>
        </section>
        <p id="message" role="status"></p>

        <h2>Saved events</h2>
        <ul id="events" class="event-list"><li>No events saved yet.</li></ul>
    </section>
</main>
<script>
    const $ = (id) => document.getElementById(id);
    const message = (text, error = false) => { $("message").textContent = text; $("message").className = error ? "error" : "success"; };
    async function request(url, options = {}) {
        const response = await fetch(url, options);
        const data = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(data.error || "The request failed.");
        return data;
    }
    function showApp(user) {
        $("login-form").classList.add("hidden");
        $("app").classList.remove("hidden");
        $("user-email").textContent = user;
        loadEvents();
    }
    async function loadEvents() {
        const data = await request("/api/events");
        $("events").innerHTML = data.events.length
            ? data.events.map((event) => `<li><strong>${escapeHtml(event.name)}</strong> — ${event.date} at ${event.time} (${escapeHtml(event.timezone)})</li>`).join("")
            : "<li>No events saved yet.</li>";
    }
    function escapeHtml(value) { return String(value).replace(/[&<>"']/g, (char) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#039;" }[char])); }
    $("login-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        try {
            const data = await request("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ email: $("email").value, password: $("password").value }) });
            showApp(data.email);
        } catch (error) { message(error.message, true); }
    });
    $("logout").addEventListener("click", async () => { await request("/api/logout", { method: "POST" }); location.reload(); });
    $("extract-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        $("extract-button").disabled = true; message("Downloading and analysing the reel...");
        try {
            const data = await request("/api/extract", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ url: $("reel-url").value }) });
            $("event-name").value = data.event.name || "";
            $("event-date").value = data.event.date || "";
            $("event-time").value = data.event.time || "";
            $("event-timezone").value = data.event.timezone || "Europe/London";
            $("save-form").dataset.sourceUrl = data.event.source_url;
            $("assumption").textContent = data.event.timezone_assumed ? "Timezone defaulted to Europe/London. Please verify it." : "";
            $("result").classList.remove("hidden"); message("Review the extracted details before saving.");
        } catch (error) { message(error.message, true); }
        finally { $("extract-button").disabled = false; }
    });
    $("save-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        try {
            await request("/api/events", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ name: $("event-name").value, date: $("event-date").value, time: $("event-time").value, timezone: $("event-timezone").value, source_url: $("save-form").dataset.sourceUrl || "instagram" }) });
            $("result").classList.add("hidden"); $("extract-form").reset(); message("Event saved."); loadEvents();
        } catch (error) { message(error.message, true); }
    });
    request("/api/session").then((data) => { if (data.email) showApp(data.email); }).catch(() => {});
</script>
</body>
</html>
