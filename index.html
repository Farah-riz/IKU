
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>our little plans.</title>
  <link rel="stylesheet" href="index.css">
  <script src="index.js" defer></script>
</head>
<body>

  <main class="landing">

    <p class="top-note">a little book of big plans</p>

    <button class="journal" id="open-btn"
      aria-label="Open our little plans notebook">

      <div class="back-cover"></div>
      <div class="page-stack"></div>
      <div class="ribbon"></div>

      <div class="front-cover">
        <div class="stitching stitching-top"></div>
        <div class="stitching stitching-bottom"></div>

        <div class="cover-writing">
          <span class="volume">OUR LITTLE PLANS · VOL. 01</span>

          <h1>
            PLANS THAT<br>
            LEAVE THE GC
          </h1>

          <span class="cover-subtitle">
            save it · plan it · live it
          </span>
        </div>
      </div>

    </button>

    <p class="open-hint">click the notebook to open ↗</p>

  </main>

</body>
</html>
