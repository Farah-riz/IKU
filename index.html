
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Our Little Plans</title>
  <link rel="stylesheet" href="index.css">
  <script src="index.js" defer></script>
</head>

<body>
  <main class="homepage">

    <div class="notebook">

      <!-- Spiral binding -->
      <div class="spiral">
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
        <span></span>
      </div>

      <!-- Notebook cover -->
      <div class="notebook-cover">

        <div class="cover-border"></div>

        <div class="cover-content">
          <p class="subtitle">A LITTLE BOOK OF BIG PLANS</p>

          <h1>
            our little<br>
            <em>plans.</em>
          </h1>

          <div class="divider"></div>

          <p class="description">
            places to go, things to do,<br>
            memories to make.
          </p>

          <button id="open-btn" class="open-button">
            Open notebook →
          </button>
        </div>

        <p class="cover-footer">COLLECT MOMENTS, NOT SCREENSHOTS ✳</p>

      </div>
    </div>

  </main>
</body>
</html>
